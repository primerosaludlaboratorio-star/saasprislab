# PRISLAB — Quality Gate (Punto 20)
# Suite crítica en SQLite (rápido); sin GOOGLE_CLOUD_PROJECT → BD local según config/settings.py
name: PRISLAB Quality Gate

on:
  push:
    branches: [master, main, release/v1.0-local]
  pull_request:
    branches: [master, main, release/v1.0-local]

env:
  DJANGO_SETTINGS_MODULE: config.settings
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  # Build hermético: no usar secretos reales de producción
  SECRET_KEY: "ci-prislab-quality-gate-dummy-secret-key-not-for-production-min-55chars"
  # Clave Fernet válida (solo CI); generar otra con: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  FERNET_KEY: "crFEHsDc7QApfMoN2nKLLdaHvGW4TMfx4vB7Wf8DYOE="
  OPENAI_API_KEY: "CI-dummy"
  GOOGLE_API_KEY: "CI-dummy"
  # No vaciar GITHUB_TOKEN: el runner y setup-python (cache: pip) necesitan el token por defecto.
  # El sentinel GitHub en la app exige GITHUB_REPO además del token; GITHUB_REPO vacío desactiva llamadas API.
  GITHUB_REPO: ""

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # WeasyPrint: el paquete pip en ubuntu-latest suele necesitar GTK/Pango/Cairo del sistema
      # (OSError al importar si faltan; pdf_generator solo capturaba ImportError).
      # WeasyPrint: Noble 24.04 → libgdk-pixbuf-2.0-0; Jammy 22.04 → libgdk-pixbuf2.0-0
      - name: Install OS libs for WeasyPrint (CI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libffi-dev shared-mime-info
          sudo apt-get install -y --no-install-recommends libgdk-pixbuf-2.0-0 || \
            sudo apt-get install -y --no-install-recommends libgdk-pixbuf2.0-0

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration check
        run: python manage.py makemigrations --check --no-input

      - name: Quality Gate — suite ampliada (Guardian, CFDI, Westgard, fórmulas LIMS, inventario FEFO/stock, offline, sandbox, ética IA)
        run: |
          coverage run --parallel-mode manage.py test \
            core.tests.test_guardian_v53 \
            core.tests.test_e2e_cfdi \
            core.tests.test_tenant_isolation \
            core.tests.test_lims_config_tenant_security \
            laboratorio.tests.test_westgard \
            laboratorio.tests.test_cci_canal \
            laboratorio.tests.test_cci_lj_postgres_guard \
            core.tests.test_clinical_math \
            inventario.tests \
            core.tests.test_offline_idempotency \
            core.tests.test_sandbox_telegram \
            core.tests.test_ia_ethics_p18 \
            core.tests.test_enterprise_security_closures \
            core.tests.test_gemini_transport_canonical \
            core.tests.test_production_user_command \
            laboratorio.tests.test_compliance_iso15189 \
            pris_ai_core.test_views_security
          if [ -f scripts_cursor_e2e/run_cursor_reliability_suite.py ]; then
            python scripts_cursor_e2e/run_cursor_reliability_suite.py
          else
            echo "Cursor reliability suite no presente; se omite."
          fi

          coverage combine
          coverage report -m
          coverage xml -o coverage.xml

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-quality-gate
          path: coverage.xml
          if-no-files-found: warn

  postgres-quality-gate:
    name: PostgreSQL integration gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prislab_user
          POSTGRES_PASSWORD: prislab_test_password
          POSTGRES_DB: prislab_v5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: "ci-prislab-postgres-dummy-secret-key-not-for-production-min-55chars"
      FERNET_KEY: "crFEHsDc7QApfMoN2nKLLdaHvGW4TMfx4vB7Wf8DYOE="
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: prislab_v5
      DB_USER: prislab_user
      DB_PASSWORD: prislab_test_password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Django checks and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --no-input
          python manage.py migrate --noinput

      - name: PostgreSQL integration tests
        run: |
          python manage.py test \
            laboratorio.tests.test_cci_lj_postgres_guard \
            laboratorio.tests.test_cci_canal \
            core.tests.test_tenant_isolation \
            core.tests.test_lims_config_tenant_security \
            contabilidad.tests.test_views_public_autofactura \
            ia.tests \
            core.tests.test_enterprise_security_closures \
            core.tests.test_gemini_transport_canonical \
            core.tests.test_production_user_command \
            laboratorio.tests.test_compliance_iso15189 \
            pris_ai_core.test_views_security -v 2
