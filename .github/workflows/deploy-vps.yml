name: PRISLAB Deploy to VPS

on:
  push:
    branches: [release/v1.0-local]
    paths:
      # La documentación aislada no dispara este flujo; se usa un cambio de código,
      # script, infraestructura o workflow para activar un despliegue real.
      - 'academia/**'
      - 'bienestar/**'
      - 'config/**'
      - 'consultorio/**'
      - 'contabilidad/**'
      - 'core/**'
      - 'enfermeria/**'
      - 'farmacia/**'
      - 'ia/**'
      - 'inventario/**'
      - 'iot/**'
      - 'laboratorio/**'
      - 'lims/**'
      - 'logistica/**'
      - 'mantenimiento/**'
      - 'marketing/**'
      - 'middleware_local/**'
      - 'monitoring/**'
      - 'nginx/**'
      - 'pacientes/**'
      - 'pris_ai_core/**'
      - 'recepcion/**'
      - 'reglas_negocio/**'
      - 'scripts/**'
      - 'seguridad/**'
      - 'suscripciones/**'
      - 'templates/**'
      - 'tools/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.monitoring.yml'
      - 'manage.py'
      - 'requirements.txt'
      - 'runtime.txt'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de despliegue'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHONUNBUFFERED: "1"

jobs:
  deploy:
    name: Deploy to VPS (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on VPS
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
            set -euo pipefail
            ROOT_DIR="${{ vars.DEPLOY_ROOT_DIR || '/opt/prislab' }}"
            APP_DIR="${{ vars.DEPLOY_APP_DIR || '/opt/prislab/app' }}"
            APP_USER="${{ vars.DEPLOY_APP_USER || 'prislab' }}"

            mkdir -p "$ROOT_DIR"
            mkdir -p "$APP_DIR"

            echo "==> Sync release/v1.0-local into ${APP_DIR}"
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo -u "$APP_USER" git -C "$APP_DIR" init
              sudo -u "$APP_USER" git -C "$APP_DIR" remote add origin https://github.com/primerosaludlaboratorio-star/saasprislab.git || true
            fi

            chown -R "$APP_USER:$APP_USER" "$APP_DIR"
            sudo -u "$APP_USER" git -C "$APP_DIR" fetch --depth 1 origin release/v1.0-local
            sudo -u "$APP_USER" git -C "$APP_DIR" checkout -B release/v1.0-local FETCH_HEAD
            sudo -u "$APP_USER" git -C "$APP_DIR" reset --hard FETCH_HEAD

            echo "==> Run migrations"
            cd "$APP_DIR"
            sudo -u "$APP_USER" .venv/bin/python scripts/run_manage_with_env.py migrate --noinput

            echo "==> Collect static files"
            sudo -u "$APP_USER" .venv/bin/python scripts/run_manage_with_env.py collectstatic --noinput

            echo "==> Restart services"
            systemctl restart prislab-gunicorn
            systemctl restart prislab-celery
            systemctl restart prislab-celerybeat
            systemctl reload nginx

            echo "==> Verify services"
            systemctl is-active prislab-gunicorn
            systemctl is-active prislab-celery
            systemctl is-active prislab-celerybeat

            echo "==> Health check"
            for i in {1..12}; do
              if curl -fsS http://127.0.0.1/health/ >/dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for app... ($i/12)"
              sleep 5
            done
            echo "Health check failed" >&2
            exit 1
          REMOTE_SCRIPT

      - name: Smoke test public endpoints
        run: |
          set -euo pipefail
          BASE_URL="${{ vars.PUBLIC_BASE_URL || format('https://{0}', secrets.DEPLOY_HOST) }}"
          echo "==> Smoke tests against ${BASE_URL}"
          for endpoint in /live/ /ready/ /health/; do
            url="${BASE_URL}${endpoint}"
            echo "Testing ${url}"
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$status" -ne 200 ]; then
              echo "Smoke test failed for ${url}: HTTP ${status}" >&2
              exit 1
            fi
            echo "OK ${url} -> ${status}"
          done
