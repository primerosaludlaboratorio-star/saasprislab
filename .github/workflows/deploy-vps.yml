name: PRISLAB Deploy to VPS

on:
  push:
    branches: [release/v1.0-local]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de despliegue'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHONUNBUFFERED: "1"

jobs:
  deploy:
    name: Deploy to VPS (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on VPS
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
            set -euo pipefail
            DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/opt/prislab' }}"
            COMPOSE_FILE="${{ vars.COMPOSE_FILE || 'docker-compose.yml' }}"
            cd "$DEPLOY_DIR"

            echo "==> Pull latest code"
            git fetch origin
            git checkout release/v1.0-local
            git pull origin release/v1.0-local

            echo "==> Build and start services"
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --build

            echo "==> Run migrations"
            docker compose -f "$COMPOSE_FILE" exec -T app python manage.py migrate --noinput

            echo "==> Collect static files"
            docker compose -f "$COMPOSE_FILE" exec -T app python manage.py collectstatic --noinput

            echo "==> Health check"
            for i in {1..12}; do
              if curl -fsS http://localhost:8000/live/ >/dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for app... ($i/12)"
              sleep 5
            done
            echo "Health check failed" >&2
            exit 1
          REMOTE_SCRIPT

      - name: Smoke test public endpoints
        run: |
          set -euo pipefail
          echo "==> Smoke tests against https://${{ secrets.DEPLOY_HOST }}"
          for endpoint in /live/ /ready/ /health/ /metrics/; do
            url="https://${{ secrets.DEPLOY_HOST }}${endpoint}"
            echo "Testing ${url}"
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$status" -ne 200 ]; then
              echo "Smoke test failed for ${url}: HTTP ${status}" >&2
              exit 1
            fi
            echo "OK ${url} -> ${status}"
          done

      - name: Restart monitoring stack (if configured)
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
            set -euo pipefail
            DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/opt/prislab' }}"
            cd "$DEPLOY_DIR"
            if [ -f docker-compose.monitoring.yml ]; then
              echo "==> Restarting monitoring stack"
              docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d prometheus grafana alertmanager
            else
              echo "==> docker-compose.monitoring.yml not found; skipping monitoring restart"
            fi
          REMOTE_SCRIPT
        continue-on-error: true
